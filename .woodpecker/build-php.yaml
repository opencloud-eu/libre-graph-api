---
variables:
  - &alpine_image 'owncloudci/alpine:latest'
  - &node_image 'node:22-alpine'
  - &generator_image 'openapitools/openapi-generator-cli:v7.13.0@sha256:52b4b2bb6129b086b0f12614e98c884d378a84349fa114b07e20515702a793c5'
  - &environment
    HTTP_PROXY:
      from_secret: ci_http_proxy
    HTTPS_PROXY:
      from_secret: ci_http_proxy

when:
  - event: [ push, manual ]
    branch: main
  - event: [ pull_request, tag ]

steps:
  clone_target_repo:
    image: woodpeckerci/plugin-git
    settings:
      branch: main
      ref: HEAD
      path: libre-graph-api-php
      remote: https://github.com/opencloud-eu/libre-graph-api-php.git
  compile-spec:
    image: *node_image
    environment: *environment
    commands:
      - sh scripts/compile-spec.sh
  generate-php:
    image: *generator_image
    environment: *environment
    commands:
      - rm -Rf libre-graph-api-php/*
      - sh scripts/generate-php.sh
      - cp LICENSE libre-graph-api-php/LICENSE
  diff:
    image: *alpine_image
    environment: *environment
    commands:
      - cd libre-graph-api-php
      - git diff
  git-tag:
    image: *alpine_image
    environment: *environment
    commands:
      - cd libre-graph-api-php
      - git config user.email devops@opencloud.eu
      - git config user.name "OpenCloud Devops"
      - git tag -a ${CI_COMMIT_TAG} -m "release $CI_COMMIT_TAG"
    when:
      - event: tag
  push_target_repo:
    image: quay.io/thegeeklab/wp-git-action:v2.2.0
    settings:
      path: libre-graph-api-php
      remote_url: https://github.com/opencloud-eu/libre-graph-api-php.git
      branch: main
      action:
        - commit
        - push
      followtags: true
      commit-message-from: CI_COMMIT_MESSAGE
      netrc_password:
        from_secret: github_token
      netrc_username:
        from_secret: github_username
    when:
      - event: [ push , manual ]
        branch: main
      - event: tag
